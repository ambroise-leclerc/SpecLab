name: SpecLab CI/CD

on:
  push:
    branches: [ main, develop, 'feature/*', 'release/*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly builds at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug mode'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read

env:
  # Pinned, not 'latest'. CMakeLists.txt hardcodes CMAKE_EXPERIMENTAL_CXX_IMPORT_STD to a
  # specific UUID, and CMake changes that UUID as the `import std` experimental feature evolves
  # from release to release. A CMake that does not recognise the UUID rejects it ("set to
  # incorrect value"), silently stops synthesising the std module, and the build collapses into
  # hundreds of "could not find module 'std'" errors. 4.1.1 is the version MduX pins for the
  # same reason - keep the two in step when either moves.
  CMAKE_VERSION: '4.1.1'
  BUILD_TYPE: Release

jobs:
  # ============================================================================
  # Windows MSVC Builds (Primary Medical Device Platform)
  # ============================================================================
  windows-msvc:
    name: Windows MSVC (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC 17.14+ (VS 2022 17.10+) - required for C++23 modules
          - os: windows-2022
            arch: x64
          - os: windows-2022
            arch: x86

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # SHA-pinned rather than @v1: this action rewrites the whole compiler environment for every
    # later step, so an unreviewed upstream change silently changes which toolchain CI builds
    # with. Same pin MduX uses.
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ matrix.arch }}
        vsversion: 2022

    - name: Install CMake and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: ${{ env.CMAKE_VERSION }}

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.cmake
        key: ${{ runner.os }}-cmake-${{ matrix.arch }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-${{ matrix.arch }}-

    # Ninja, not "Visual Studio 17 2022". The VS generator does not drive CMake's `import std`
    # support - it is the documented cause of the "could not find module 'std'" failures in this
    # project's own troubleshooting notes, and MduX builds MSVC through Ninja for the same
    # reason. The compiler still comes from msvc-dev-cmd above; only the generator changes.
    #
    # Ninja is single-config, so CMAKE_BUILD_TYPE (not --config) selects the configuration and
    # binaries land in build/examples/ rather than build/examples/Release/.
    - name: Configure CMake
      run: |
        cmake -B build `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DSPECLAB_BUILD_EXAMPLES=ON `
          -DSPECLAB_BUILD_TESTS=OFF

    - name: Build SpecLab
      run: cmake --build build --parallel

    - name: Run basic example
      run: |
        cd build/examples
        ./basic_example.exe

    - name: Run pulse oximeter example
      run: |
        cd build/examples
        ./pulse_oximeter_example.exe

    - name: Generate medical device compliance report
      run: |
        echo "# Medical Device Compliance Report" > compliance-report.md
        echo "## Build Information" >> compliance-report.md
        echo "- Platform: Windows ${{ matrix.arch }}" >> compliance-report.md
        # Record the toolset actually used, not a hardcoded matrix string - a compliance record
        # naming a compiler version the build never ran is worse than no record at all.
        echo "- Compiler: MSVC (VS toolset $env:VSCMD_VER)" >> compliance-report.md
        echo "- Generator: Ninja" >> compliance-report.md
        echo "- CMake: ${{ env.CMAKE_VERSION }}" >> compliance-report.md
        echo "- Build Type: ${{ env.BUILD_TYPE }}" >> compliance-report.md
        echo "- Standards: IEC 62304, ISO 13485, ISO 14971" >> compliance-report.md

    - name: Upload compliance artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-msvc-${{ matrix.arch }}-compliance
        path: |
          compliance-report.md
          build/examples/*.exe

  # ============================================================================
  # Linux GCC Builds (Development Platform)
  # ============================================================================
  linux-gcc:
    name: Linux GCC ${{ matrix.gcc-version }}
    runs-on: ubuntu-latest
    container:
      image: gcc:${{ matrix.gcc-version }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 16 only. There is deliberately no GCC 15 leg.
          #
          # GCC 15 cannot build this project with `import std`: it does not round-trip parts of
          # libstdc++'s std module through a second-level BMI, so compiling
          # speclab.runners.testrunner (which imports speclab.core.testsuite, which imports std)
          # fails with "failed to read compiled module cluster N: Bad file data". Reproducible on
          # 15.2 and in CI, and unrelated to how SpecLab uses std::future - it persists with
          # every future/promise/async removed from the tree.
          #
          # The leg was carried briefly as continue-on-error, but a job that is expected to fail
          # teaches a reader nothing and leaves a permanent red check on every PR. Add a leg back
          # when there is a GCC 15.x that actually builds this project.
          - gcc-version: "16.2"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        # Update package lists and install essential tools
        apt-get update
        apt-get install -y \
          ninja-build \
          git \
          wget \
          curl \
          pkg-config

    - name: Install CMake 4.0+
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: ${{ env.CMAKE_VERSION }}

    - name: Setup GCC
      run: |
        # The gcc:N container already provides the compiler as plain gcc/g++.
        gcc --version
        g++ --version
        # Versioned symlinks so the configure step below can name the compiler explicitly
        # and fail loudly if the container ever ships a different major version.
        ln -sf /usr/local/bin/gcc /usr/local/bin/gcc-${{ matrix.gcc-version }}
        ln -sf /usr/local/bin/g++ /usr/local/bin/g++-${{ matrix.gcc-version }}

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.cmake
          ~/.ccache
        key: ${{ runner.os }}-gcc${{ matrix.gcc-version }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-gcc${{ matrix.gcc-version }}-

    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc-version }} \
          -DCMAKE_C_COMPILER=gcc-${{ matrix.gcc-version }} \
          -DSPECLAB_BUILD_EXAMPLES=ON \
          -DSPECLAB_BUILD_TESTS=OFF

    - name: Build SpecLab
      run: cmake --build build --parallel

    - name: Run basic example
      run: |
        cd build/examples
        ./basic_example

    - name: Run pulse oximeter example
      run: |
        cd build/examples
        ./pulse_oximeter_example

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-gcc${{ matrix.gcc-version }}-artifacts
        path: |
          build/libspeclab.a
          build/examples/basic_example
          build/examples/pulse_oximeter_example

  # ============================================================================
  # Linux Clang Builds (Alternative Compiler) - DISABLED
  #
  # This job was previously "disabled" only by having the word in its name
  # (linux-clang-disabled): GitHub Actions does not read job names, so it ran on every push
  # and failed on every push. It is commented out below, which is what actually disables it.
  #
  # Why it is off: Clang 20 needs a std module and this project has no verified way to give it
  # one. The manual route (clang --precompile .../libc++/v1/std.cppm, -fmodule-file=std=...)
  # collides with the __CMAKE::CXX23 module CMake synthesises - Clang rejects two definitions
  # of module std - and the std.cppm path it needs is not present in silkeh/clang:20 at all.
  # The root CMakeLists.txt therefore has no Clang-specific module path; see the note there.
  #
  # To re-enable: get a Clang build working locally first, decide there whether the std module
  # comes from __CMAKE::CXX23 or from a precompiled std.pcm (not both), then uncomment this and
  # match whatever the CMakeLists.txt does. Do not land Clang CMake logic without this job green.
  # ============================================================================
  # linux-clang:
  #   name: Linux Clang ${{ matrix.clang-version }}
  #   runs-on: ubuntu-latest
  #   container:
  #     image: silkeh/clang:20
  #     options: --user root
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       include:
  #         - clang-version: 20
  #
  #   steps:
  #   - name: Install Git and essential tools
  #     run: |
  #       apt-get update
  #       apt-get install -y git
  #
  #   - name: Checkout code
  #     uses: actions/checkout@v4
  #     with:
  #       fetch-depth: 0
  #
  #   - name: Install dependencies
  #     run: |
  #       apt-get install -y \
  #         ninja-build \
  #         wget \
  #         curl \
  #         pkg-config \
  #         libc++-dev \
  #         libc++abi-dev
  #
  #   - name: Install CMake 4.0+
  #     uses: lukka/get-cmake@latest
  #     with:
  #       cmakeVersion: ${{ env.CMAKE_VERSION }}
  #
  #   - name: Setup Clang
  #     run: |
  #       clang --version
  #       clang++ --version
  #       ln -sf /usr/bin/clang /usr/bin/clang-20
  #       ln -sf /usr/bin/clang++ /usr/bin/clang++-20
  #
  #   - name: Configure CMake
  #     run: |
  #       cmake -B build \
  #         -G Ninja \
  #         -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
  #         -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang-version }} \
  #         -DCMAKE_C_COMPILER=clang-${{ matrix.clang-version }} \
  #         -DSPECLAB_BUILD_EXAMPLES=ON \
  #         -DSPECLAB_BUILD_TESTS=OFF
  #
