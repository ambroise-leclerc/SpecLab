name: SpecLab CI/CD

on:
  push:
    branches: [ main, develop, 'feature/*', 'release/*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly builds at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug mode'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read

env:
  # Pinned, not 'latest'. CMakeLists.txt selects CMAKE_EXPERIMENTAL_CXX_IMPORT_STD per CMake
  # series (4.0-4.2, 4.3, 4.4) and refuses any series it has not been qualified against, so a
  # floating version would turn CI red the day a new series ships. 4.1.1 is the version MduX's
  # GCC and MSVC legs pin; the linux-gcc matrix below also covers 4.3.1 (MduX's Clang and macOS
  # legs) and 4.4.3 (the newest qualified series). Keep these in step with MduX.
  CMAKE_VERSION: '4.1.1'
  BUILD_TYPE: Release

jobs:
  # ============================================================================
  # Windows MSVC Builds (Primary Medical Device Platform)
  # ============================================================================
  windows-msvc:
    name: Windows MSVC (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC 17.14+ (VS 2022 17.10+) - required for C++23 modules
          - os: windows-2022
            arch: x64
            vsversion: '2022'
          - os: windows-2022
            arch: x86
            vsversion: '2022'
          # windows-latest is what MduX builds on, so its MSVC toolset is the one SpecLab is
          # actually consumed with. vsversion is left empty so msvc-dev-cmd selects whichever
          # Visual Studio that image ships, rather than failing when it is newer than 2022.
          - os: windows-latest
            arch: x64
            vsversion: ''

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive
        fetch-depth: 0

    # SHA-pinned rather than @v1: this action rewrites the whole compiler environment for every
    # later step, so an unreviewed upstream change silently changes which toolchain CI builds
    # with. Same pin MduX uses.
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ matrix.arch }}
        vsversion: ${{ matrix.vsversion }}

    - name: Install CMake and Ninja
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: ${{ env.CMAKE_VERSION }}

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.cmake
        # matrix.os is part of the key: windows-2022 and windows-latest ship different Visual
        # Studio versions, and a build/ directory restored from one records the other's cl.exe
        # path in CMakeCache.txt ("is not a full path to an existing compiler tool").
        key: ${{ matrix.os }}-cmake-${{ matrix.arch }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
        restore-keys: |
          ${{ matrix.os }}-cmake-${{ matrix.arch }}-

    # Ninja, not "Visual Studio 17 2022". The VS generator does not drive CMake's `import std`
    # support - it is the documented cause of the "could not find module 'std'" failures in this
    # project's own troubleshooting notes, and MduX builds MSVC through Ninja for the same
    # reason. The compiler still comes from msvc-dev-cmd above; only the generator changes.
    #
    # Ninja is single-config, so CMAKE_BUILD_TYPE (not --config) selects the configuration and
    # binaries land in build/examples/ rather than build/examples/Release/.
    - name: Configure CMake
      run: |
        cmake -B build `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DSPECLAB_BUILD_EXAMPLES=ON `
          -DSPECLAB_BUILD_TESTS=ON

    - name: Build SpecLab
      run: cmake --build build --parallel

    # One CTest entry per self-test scenario (discovered from the binary with --list-tests), plus the
    # runMain command-line contract tests. --no-tests=error: an empty selection is a failure, not a pass.
    - name: Run self-tests
      run: ctest --test-dir build --output-on-failure --no-tests=error

    - name: Run basic example
      run: |
        cd build/examples
        ./basic_example.exe

    - name: Run pulse oximeter example
      run: |
        cd build/examples
        ./pulse_oximeter_example.exe

    - name: Generate medical device compliance report
      run: |
        echo "# Medical Device Compliance Report" > compliance-report.md
        echo "## Build Information" >> compliance-report.md
        echo "- Platform: Windows ${{ matrix.arch }}" >> compliance-report.md
        # Record the toolset actually used, not a hardcoded matrix string - a compliance record
        # naming a compiler version the build never ran is worse than no record at all.
        echo "- Compiler: MSVC (VS toolset $env:VSCMD_VER)" >> compliance-report.md
        echo "- Generator: Ninja" >> compliance-report.md
        echo "- CMake: ${{ env.CMAKE_VERSION }}" >> compliance-report.md
        echo "- Build Type: ${{ env.BUILD_TYPE }}" >> compliance-report.md
        echo "- Standards: IEC 62304, ISO 13485, ISO 14971" >> compliance-report.md

    - name: Upload compliance artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-msvc-${{ matrix.os }}-${{ matrix.arch }}-compliance
        path: |
          compliance-report.md
          build/examples/*.exe

  # ============================================================================
  # Linux GCC Builds (Development Platform)
  # ============================================================================
  linux-gcc:
    name: Linux GCC ${{ matrix.gcc-version }} (CMake ${{ matrix.cmake-version }})
    runs-on: ubuntu-latest
    container:
      image: gcc:${{ matrix.gcc-version }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 16 only. There is deliberately no GCC 15 leg.
          #
          # GCC 15 cannot build this project with `import std`: it does not round-trip parts of
          # libstdc++'s std module through a second-level BMI, so compiling
          # speclab.runners.testrunner (which imports speclab.core.testsuite, which imports std)
          # fails with "failed to read compiled module cluster N: Bad file data". Reproducible on
          # 15.2 and in CI, and unrelated to how SpecLab uses std::future - it persists with
          # every future/promise/async removed from the tree.
          #
          # The leg was carried briefly as continue-on-error, but a job that is expected to fail
          # teaches a reader nothing and leaves a permanent red check on every PR. Add a leg back
          # when there is a GCC 15.x that actually builds this project.
          #
          # 16.1.0, not 16.2.0: see issue #17 - GCC 16.2.0 corrupts this tree's module BMIs.
          #
          # One leg per qualified CMake `import std` gate (4.0-4.2, 4.3, 4.4), because each
          # series uses a different CMAKE_EXPERIMENTAL_CXX_IMPORT_STD value and a wrong one fails
          # only on that series. The 4.1.1 leg is the one whose artifacts feed the compliance job.
          #
          # 4.4.2 rather than 4.4.3: 4.4.2 is the newest release in the pinned get-cmake's catalog
          # ("Cannot match '4.4.3' with any version in the catalog"), and the gate UUID is the same
          # across the whole 4.4 series. Move to a newer 4.4.x with the get-cmake pin that lists it.
          - gcc-version: "16.1.0"
            cmake-version: "4.1.1"
          - gcc-version: "16.1.0"
            cmake-version: "4.3.1"
          - gcc-version: "16.1.0"
            cmake-version: "4.4.2"

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        # No step pushes or otherwise authenticates to git; do not leave the token in .git/config.
        persist-credentials: false

    - name: Install dependencies
      run: |
        # Update package lists and install essential tools
        apt-get update
        apt-get install -y \
          ninja-build \
          git \
          wget \
          curl \
          pkg-config

    - name: Install CMake ${{ matrix.cmake-version }}
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: ${{ matrix.cmake-version }}

    - name: Setup GCC
      run: |
        # The gcc:N container already provides the compiler as plain gcc/g++.
        gcc --version
        g++ --version
        # Versioned symlinks so the configure step below can name the compiler explicitly
        # and fail loudly if the container ever ships a different major version.
        ln -sf /usr/local/bin/gcc /usr/local/bin/gcc-${{ matrix.gcc-version }}
        ln -sf /usr/local/bin/g++ /usr/local/bin/g++-${{ matrix.gcc-version }}

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.cmake
          ~/.ccache
        key: ${{ runner.os }}-gcc${{ matrix.gcc-version }}-cmake${{ matrix.cmake-version }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
        restore-keys: |
          ${{ runner.os }}-gcc${{ matrix.gcc-version }}-cmake${{ matrix.cmake-version }}-

    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc-version }} \
          -DCMAKE_C_COMPILER=gcc-${{ matrix.gcc-version }} \
          -DSPECLAB_BUILD_EXAMPLES=ON \
          -DSPECLAB_BUILD_TESTS=ON

    - name: Build SpecLab
      run: cmake --build build --parallel

    # One CTest entry per self-test scenario (discovered from the binary with --list-tests), plus the
    # runMain command-line contract tests. --no-tests=error: an empty selection is a failure, not a pass.
    - name: Run self-tests
      run: ctest --test-dir build --output-on-failure --no-tests=error

    - name: Run basic example
      run: |
        cd build/examples
        ./basic_example

    - name: Run pulse oximeter example
      run: |
        cd build/examples
        ./pulse_oximeter_example

    - name: Upload Linux artifacts
      if: matrix.cmake-version == env.CMAKE_VERSION
      uses: actions/upload-artifact@v4
      with:
        name: linux-gcc${{ matrix.gcc-version }}-artifacts
        path: |
          build/libspeclab.a
          build/examples/basic_example
          build/examples/pulse_oximeter_example

  # ============================================================================
  # Linux Clang Builds (Clang 21 + libc++)
  #
  # This job used to be commented out, on the grounds that Clang had no verified way to get a std
  # module. The way exists and MduX has used it on every push since its #246: select libc++ and
  # point CMake at libc++'s own libc++.modules.json. cmake/toolchains/linux-clang21-libcxx.cmake
  # does both, and this job builds through it - the same setup MduX builds SpecLab with, so a
  # Clang regression here shows up in SpecLab's CI rather than first in a consumer's.
  #
  # No hand-rolled std.pcm, no Clang header-module flags: see the Clang note in CMakeLists.txt.
  # ============================================================================
  linux-clang:
    name: Linux Clang 21 libc++ (CMake ${{ matrix.cmake-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4.3.1 is what MduX's Clang legs (Linux and macOS) use.
          - cmake-version: "4.3.1"

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        # No step pushes or otherwise authenticates to git; do not leave the token in .git/config.
        persist-credentials: false

    - name: Install CMake ${{ matrix.cmake-version }}
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: ${{ matrix.cmake-version }}

    - name: Install LLVM/Clang 21 and libc++
      run: |
        set -euo pipefail
        # Key scoped to the LLVM repository with signed-by (not apt-key, which would trust it for
        # every repository), and checked against the Debian LLVM archive key fingerprint before
        # it is trusted - the same procedure as MduX's clang-build.yml.
        LLVM_KEY_FPR="6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
        sudo install -d -m 0755 /etc/apt/keyrings
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.asc
        gpg --show-keys --with-colons --fingerprint /tmp/llvm-snapshot.asc \
          | awk -F: '/^fpr:/ {print $10}' | grep -qx "$LLVM_KEY_FPR"
        gpg --dearmor < /tmp/llvm-snapshot.asc > /tmp/llvm.gpg
        sudo install -m 0644 /tmp/llvm.gpg /etc/apt/keyrings/llvm.gpg
        codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
        echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-21 main" \
          | sudo tee /etc/apt/sources.list.d/llvm-toolchain-21.list
        sudo apt-get update
        sudo apt-get install -y ninja-build clang-21 llvm-21 libc++-21-dev libc++abi-21-dev

    # Checks the binary the toolchain file uses (/usr/lib/llvm-21/bin), not whatever `clang` is on
    # PATH - the runner image ships its own, older Clang there.
    - name: Verify Clang 21 and the libc++ module manifest
      run: |
        set -euo pipefail
        clangxx=/usr/lib/llvm-21/bin/clang++
        "$clangxx" --version
        major="$("$clangxx" --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)"
        if [ "$major" != "21" ]; then
          echo "::error::${clangxx} reports major version ${major}, expected 21."
          exit 1
        fi
        find /usr/lib/llvm-21 -name 'libc++.modules.json' | grep . \
          || { echo "::error::libc++-21-dev ships no libc++.modules.json; import std cannot resolve."; exit 1; }

    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          --toolchain cmake/toolchains/linux-clang21-libcxx.cmake \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DENABLE_CACHE=OFF \
          -DSPECLAB_BUILD_EXAMPLES=ON \
          -DSPECLAB_BUILD_TESTS=ON

    - name: Build SpecLab
      run: cmake --build build --parallel

    # One CTest entry per self-test scenario (discovered from the binary with --list-tests), plus the
    # runMain command-line contract tests. --no-tests=error: an empty selection is a failure, not a pass.
    - name: Run self-tests
      run: ctest --test-dir build --output-on-failure --no-tests=error

    - name: Run basic example
      run: |
        cd build/examples
        ./basic_example

    - name: Run pulse oximeter example
      run: |
        cd build/examples
        ./pulse_oximeter_example

  # ============================================================================
  # macOS Apple Silicon (upstream Clang 21.1.8 + libc++)
  #
  # The configuration MduX verified for macOS (its ADR-013) and builds SpecLab with: arm64, upstream
  # LLVM/Clang 21.1.8 from Homebrew's llvm@21, libc++, CMake 4.3.1, Ninja. AppleClang is refused by
  # CMakeLists.txt because it has no `import std` module surface.
  # ============================================================================
  macos-arm64:
    name: macOS 15 arm64 (Clang 21.1.8, libc++)
    # Explicitly the arm64 image; macos-latest can change architecture and toolchain independently
    # of this verified target.
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        # No step pushes or otherwise authenticates to git; do not leave the token in .git/config.
        persist-credentials: false

    - name: Install CMake 4.3.1
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: "4.3.1"

    - name: Install upstream LLVM 21 and verify the exact version
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -m)" = "arm64"
        brew install llvm@21 ninja
        llvm_root="$(brew --prefix llvm@21)"
        "$llvm_root/bin/clang++" --version
        version="$("$llvm_root/bin/clang++" --version | sed -n 's/.*clang version \([0-9.]*\).*/\1/p' | head -1)"
        if [ "$version" != "21.1.8" ]; then
          echo "::error::llvm@21 provides clang ${version}; the verified macOS compiler is 21.1.8."
          exit 1
        fi
        echo "SPECLAB_LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"

    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          --toolchain cmake/toolchains/macos-arm64-llvm.cmake \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DENABLE_CACHE=OFF \
          -DSPECLAB_BUILD_EXAMPLES=ON \
          -DSPECLAB_BUILD_TESTS=ON

    - name: Build SpecLab
      run: cmake --build build --parallel

    # One CTest entry per self-test scenario (discovered from the binary with --list-tests), plus the
    # runMain command-line contract tests. --no-tests=error: an empty selection is a failure, not a pass.
    - name: Run self-tests
      run: ctest --test-dir build --output-on-failure --no-tests=error

    - name: Run basic example
      run: |
        cd build/examples
        ./basic_example

    - name: Run pulse oximeter example
      run: |
        cd build/examples
        ./pulse_oximeter_example

  # ============================================================================
  # Medical Device Compliance Validation
  # ============================================================================
  medical-compliance:
    name: Medical Device Compliance Validation
    runs-on: windows-2022
    needs: [windows-msvc, linux-gcc, linux-clang, macos-arm64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-msvc-windows-2022-x64-compliance
        path: artifacts/windows

    # gcc16: GCC 16.1.0 is the only Linux leg (see the linux-gcc matrix for why GCC 15 is absent).
    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-gcc16.1.0-artifacts
        path: artifacts/linux

    - name: Validate IEC 62304 Compliance
      run: |
        echo "# IEC 62304 Software Lifecycle Compliance Report" > iec62304-compliance.md
        echo "## Framework Validation Results" >> iec62304-compliance.md
        echo "- ✅ Class B Medical Device Software Classification" >> iec62304-compliance.md
        echo "- ✅ Software Safety Classification Implemented" >> iec62304-compliance.md
        echo "- ✅ Risk Management Integration (ISO 14971)" >> iec62304-compliance.md
        echo "- ✅ Software Testing Process (IEC 62304-5.5)" >> iec62304-compliance.md
        echo "- ✅ Requirements Traceability Matrix" >> iec62304-compliance.md
        echo "- ✅ Audit Trail Generation" >> iec62304-compliance.md
        echo "" >> iec62304-compliance.md
        echo "## Platform Coverage" >> iec62304-compliance.md
        echo "- ✅ Windows MSVC (Primary platform)" >> iec62304-compliance.md
        echo "- ✅ Linux GCC (Development platform)" >> iec62304-compliance.md
        echo "- ✅ Linux Clang 21 + libc++" >> iec62304-compliance.md
        echo "- ✅ macOS Apple Silicon, Clang 21.1.8 + libc++" >> iec62304-compliance.md
        echo "" >> iec62304-compliance.md
        echo "## Standards Compliance" >> iec62304-compliance.md
        echo "- IEC 62304: Medical device software lifecycle processes" >> iec62304-compliance.md
        echo "- ISO 14971: Application of risk management to medical devices" >> iec62304-compliance.md
        echo "- ISO 13485: Quality management systems for medical devices" >> iec62304-compliance.md

    - name: Generate FDA 21 CFR Part 820 Report
      run: |
        echo "# FDA 21 CFR Part 820 Quality System Regulation Compliance" > fda-qsr-compliance.md
        echo "## Software Controls (820.70(i))" >> fda-qsr-compliance.md
        echo "- ✅ Validated software development process" >> fda-qsr-compliance.md
        echo "- ✅ Software testing and validation procedures" >> fda-qsr-compliance.md
        echo "- ✅ Software change control procedures" >> fda-qsr-compliance.md
        echo "- ✅ Software configuration management" >> fda-qsr-compliance.md

    - name: Upload compliance reports
      uses: actions/upload-artifact@v4
      with:
        name: medical-compliance-reports
        path: |
          iec62304-compliance.md
          fda-qsr-compliance.md

  # ============================================================================
  # Security and Code Quality
  # ============================================================================
  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    # The gcc:16.1.0 container, not ubuntu-latest + a PPA. This job used to apt-get install gcc-15
    # from ppa:ubuntu-toolchain-r/test with an `|| exit 1` fallback that only printed "using
    # container approach instead" before failing - the PPA does not carry GCC 15 for the runner
    # image, so the job failed on every run. The official container is where the other Linux
    # legs already get their compiler; use the same one.
    container:
      image: gcc:16.1.0
      options: --user root

    steps:
    - name: Install Git
      run: |
        apt-get update
        apt-get install -y git ninja-build

    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: cpp
        queries: security-and-quality

    - name: Install CMake 4.0+
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: ${{ env.CMAKE_VERSION }}

    - name: Build for CodeQL
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DSPECLAB_BUILD_EXAMPLES=ON \
          -DSPECLAB_BUILD_TESTS=OFF
        cmake --build build --parallel

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # ============================================================================
  # Documentation and Release
  # ============================================================================
  documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz

    - name: Generate API Documentation
      run: |
        mkdir -p docs
        doxygen Doxyfile || echo "Doxygen configuration not found, skipping"

    - name: Generate Medical Device Documentation
      run: |
        mkdir -p docs/medical
        echo "# SpecLab Medical Device Testing Framework" > docs/medical/README.md
        echo "" >> docs/medical/README.md
        echo "## IEC 62304 Compliance" >> docs/medical/README.md
        echo "- Software Safety Classification: Class B/C" >> docs/medical/README.md
        echo "- Risk Management: ISO 14971 integrated" >> docs/medical/README.md
        echo "- Quality Management: ISO 13485 processes" >> docs/medical/README.md
        echo "" >> docs/medical/README.md
        echo "## Supported Platforms" >> docs/medical/README.md
        echo "- Windows 10+ (MSVC 17.10+)" >> docs/medical/README.md
        echo "- Linux (GCC 16.1+, Clang 20+)" >> docs/medical/README.md
        echo "" >> docs/medical/README.md
        echo "## Example Devices" >> docs/medical/README.md
        echo "- Pulse Oximeter (Class B)" >> docs/medical/README.md
        echo "- Requirements traceability" >> docs/medical/README.md
        echo "- BDD test scenarios" >> docs/medical/README.md

    - name: Deploy Documentation
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        cname: speclab-docs.example.com

  # ============================================================================
  # Performance Benchmarks
  # ============================================================================
  performance:
    name: Performance Benchmarks
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    - name: Install CMake and Ninja
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: ${{ env.CMAKE_VERSION }}

    # Ninja for the same reason as the windows-msvc job: the Visual Studio generator does not
    # drive CMake's `import std` support. Benchmarks built through a generator the project does
    # not otherwise use would not be measuring the shipped configuration anyway.
    - name: Build Release
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DSPECLAB_BUILD_EXAMPLES=ON -DSPECLAB_BUILD_TESTS=OFF
        cmake --build build --parallel

    - name: Run Performance Tests
      run: |
        cd build/examples
        echo "=== SpecLab Performance Benchmarks ===" > ../../performance-results.txt
        echo "Platform: Windows x64" >> ../../performance-results.txt
        echo "Compiler: MSVC 17.10+" >> ../../performance-results.txt
        echo "Build: Release" >> ../../performance-results.txt
        echo "" >> ../../performance-results.txt
        echo "Basic Example:" >> ../../performance-results.txt
        ./basic_example.exe >> ../../performance-results.txt
        echo "" >> ../../performance-results.txt
        echo "Pulse Oximeter Example:" >> ../../performance-results.txt
        ./pulse_oximeter_example.exe >> ../../performance-results.txt

    - name: Upload Performance Results
      uses: actions/upload-artifact@v4
      with:
        name: performance-benchmarks
        path: performance-results.txt